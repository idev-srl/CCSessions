name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test
        run: go test ./internal/...

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = $version
          $cfg | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          wails build -clean -trimpath -ldflags "-s -w -X main.version=$env:VERSION"

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/bin/ccsessions.exe "$dir/ccsessions.exe"
          Copy-Item LICENSE, NOTICE, README.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "ccsessions-$env:VERSION-windows-amd64.zip"
          Copy-Item build/bin/ccsessions.exe "ccsessions-$env:VERSION-windows-amd64.exe"
          Get-FileHash "ccsessions-$env:VERSION-windows-amd64.*" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: CC Sessions ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ccsessions-*-windows-amd64.zip
            ccsessions-*-windows-amd64.exe
            SHA256SUMS.txt
